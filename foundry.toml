[profile.default]
src = "contracts"
test = "test-contracts"
out = "out"
cache_path = "cache"
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=contracts/vendor/openzeppelin-contracts/contracts/",
  "solady/=contracts/vendor/solady/src/",
]
fs_permissions = [{ access = "read", path = "./evidence" }]
ignored_warnings_from = ["contracts/vendor"]

[fuzz]
runs = 256

[fmt]
line_length = 120
